# Base service definition. It is intentionally host-agnostic: it declares HOW to
# build/run the router, but NOT where the weights/configs live on a given host.
# Those three mounts (/models, /configs, /webui) are supplied by the deployer:
#   - standalone:   copy docker-compose.override.yml.example -> docker-compose.override.yml
#   - orchestrated: a parent compose `include:`s this file and patches in the mounts
#                   (see the multi-service stack in the deploy README).
# This keeps `git pull` clean — host specifics never live in this tracked file.
services:
  llama-router:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: llama-router
    container_name: llama-router
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - ROUTER_CONFIG_PATH=/configs/config.json
      - LLAMA_PRESETS_PATH=/configs/presets.ini
      - HISTORY_DB_PATH=/webui/monitor/history.db
    # Override the base image's healthcheck (it probes :8080, but the router
    # listens on :11434); /v1/models returns 200 whenever the router is up,
    # regardless of whether a model is loaded.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/v1/models"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Reserve all NVIDIA GPUs; the router masks each spawned llama-server to its
    # model's `gpus` via CUDA_VISIBLE_DEVICES. To expose only some, override
    # `count`/`device_ids` from the deployer file.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
