<!DOCTYPE html>
<html lang="en" data-theme="seasons">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLaMa Router — Chat</title>
  <!-- Seasonal design language (fonts + palette + pill navbar + Aa popover).
       theme.js is loaded synchronously and init()'d here so the saved palette
       is applied before first paint (no flash). -->
  <link rel="preload" href="/webui/fonts/GoogleSansFlex.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/webui/theme.css" />
  <script src="/webui/theme.js"></script>
  <script>window.LRTheme.init();</script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <script>tailwind.config = { theme: { extend: {} } };</script>
  <style>
    /* Instance tabs: a compact pill row above the embedded UI. */
    .chat-tab {
      display: flex; align-items: center; gap: 0.4rem;
      padding: 0.3rem 0.7rem; border-radius: 0.6rem;
      background: var(--surface0); color: var(--subtext0);
      border: 1px solid transparent; cursor: pointer; white-space: nowrap;
      font-size: 0.8rem; transition: background 0.15s, color 0.15s;
    }
    .chat-tab:hover { background: var(--surface1); }
    /* Model load/unload chips: daisyUI's btn-ghost hover tints with base-content
       (white in dark themes) — the same token as the label — so the text washes
       out to white-on-white. Pin hover to surface tokens for readable contrast. */
    .model-chip.btn-ghost:hover { background: var(--surface1); color: var(--text); }
    .chat-tab.active { background: var(--surface1); color: var(--text); border-color: var(--overlay0); }
    /* The embedded llama.cpp UI fills the remaining space. */
    .chat-frame { width: 100%; height: 100%; border: 0; display: block; background: var(--base); }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden bg-base-100 text-base-content">
  <div id="app" class="flex flex-col h-full min-h-0">
    <!-- Floating pill navbar -->
    <div class="lr-navbar">
      <div class="lr-brand">
        <span class="lr-brand-name">LLaMa Router</span>
        <div class="flex items-center gap-1.5">
          <span class="opacity-50 text-sm">(</span>
          <div class="w-2 h-2 rounded-full flex-shrink-0" :class="statusDotClass"></div>
          <span class="font-mono text-sm opacity-70">{{ routerStatus }}</span>
          <span class="opacity-50 text-sm">)</span>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <nav class="lr-nav-links">
          <a href="/chat" class="nav-link active">Chat</a>
          <a href="/dash" class="nav-link">Dashboard</a>
          <a href="/translate" class="nav-link">Translate</a>
        </nav>
        <!-- "Aa" appearance popover: palette / mode / text size -->
        <details class="settings-menu">
          <summary class="settings-toggle" title="Appearance">Aa</summary>
          <div class="settings-body">
            <div class="settings-label">Palette</div>
            <div class="settings-row">
              <button v-for="name in themeNames" :key="name" class="swatch"
                :class="{ active: name === ui.theme }" :style="swatchStyle(name)"
                :title="name" @click.prevent="selectTheme(name)"></button>
            </div>
            <div class="settings-label">Mode</div>
            <div class="seg">
              <button v-for="opt in modeOptions" :key="opt.value" class="seg-btn"
                :class="{ active: opt.value === ui.variantMode }"
                @click.prevent="selectVariant(opt.value)">{{ opt.label }}</button>
            </div>
            <div class="settings-label">Text size</div>
            <div class="seg">
              <button v-for="opt in sizeOptions" :key="opt.value" class="seg-btn"
                :class="{ active: opt.value === ui.fontSize }"
                @click.prevent="selectFontSize(opt.value)">{{ opt.label }}</button>
            </div>
          </div>
        </details>
      </div>
    </div>

    <!-- Main content: models strip + tabbed embedded UI, filling the viewport -->
    <div class="flex-1 min-h-0 flex flex-col gap-3 p-4 max-w-screen-2xl w-full mx-auto">

      <!-- Models: load/unload chips (the embedded UI can also load/unload, but
           this gives a fleet-wide view the single-model UI lacks). -->
      <div class="card bg-base-200 border border-base-300 flex-shrink-0">
        <div class="card-body p-3 gap-2">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="text-xs font-semibold uppercase tracking-wider opacity-60 mr-1">Models</span>
            <button v-for="m in models" :key="m.id"
              class="btn btn-xs gap-1.5 model-chip"
              :class="m.loaded ? 'btn-outline btn-success' : 'btn-ghost'"
              @click="m.loaded ? unloadModel(m.id) : loadModel(m.id)"
              :disabled="m.loading">
              <span v-if="m.loading" class="loading loading-spinner loading-xs"></span>
              <span v-else class="w-1.5 h-1.5 rounded-full"
                :class="m.loaded ? 'bg-success' : 'bg-base-content/30'"></span>
              <span class="font-mono normal-case">{{ m.id }}</span>
            </button>
            <span v-if="models.length === 0" class="text-xs opacity-40">No models configured</span>
          </div>
        </div>
      </div>

      <!-- Instances: one tab per live llama-server replica; each iframe embeds
           that replica's own UI directly (never through the router). -->
      <div class="card bg-base-200 border border-base-300 flex-1 min-h-0 flex flex-col overflow-hidden">
        <!-- Tab bar -->
        <div class="flex items-center gap-1.5 p-2 border-b border-base-300 flex-shrink-0 overflow-x-auto">
          <div v-for="t in instances" :key="t.port"
            class="chat-tab" :class="{ active: t.port === activeTab }"
            @click="selectTab(t.port)">
            <span class="font-mono normal-case">{{ t.model }}</span>
            <span class="opacity-50 text-xs">:{{ t.port }}</span>
          </div>
          <div class="flex-1"></div>
          <button class="btn btn-xs btn-ghost opacity-60 hover:opacity-100"
            @click="reloadActive" title="Reload this instance" :disabled="!anyLoaded">↻</button>
        </div>

        <!-- Embedded UI area -->
        <div class="relative flex-1 min-h-0">
          <!-- Empty state: nothing loaded, so there is no instance to embed. -->
          <div v-if="!anyLoaded"
            class="absolute inset-0 flex flex-col items-center justify-center gap-3 text-center p-6">
            <div class="w-10 h-10 rounded-full border-2 border-base-content/20 flex items-center justify-center opacity-50">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M8 12h8M8 8h8m-8 8h5M5 3h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2z"/>
              </svg>
            </div>
            <div class="text-sm opacity-70">Load a model first to see the chat UI.</div>
            <div class="text-xs opacity-40">Pick one above, or from the Dashboard.</div>
          </div>
          <!-- One iframe per live instance, loaded via the same-origin
               /instance/{port}/ proxy. Only the active one is shown so switching
               tabs doesn't reload the others. That proxy forwards straight to the
               replica, off the scheduler/RWLock, so UI traffic never blocks unload. -->
          <template v-else>
            <iframe v-for="t in instances" :key="t.port + '.' + (nonces[t.port] || 0)"
              v-show="t.port === activeTab"
              class="chat-frame absolute inset-0"
              :src="frameSrc(t.port)"
              title="llama.cpp chat"></iframe>
          </template>
        </div>
      </div>
    </div>
  </div>

  <script>
    const T = window.LRTheme;
    const { createApp, ref, reactive, computed, onMounted, onUnmounted } = Vue;

    // Tabs are derived from live router state (one per instance), not persisted:
    // chat history lives in each embedded UI and is intentionally disposable
    // (the real client is elsewhere).

    createApp({
      setup() {
        // "Aa" appearance popover state (mirrors LRTheme.state for active-highlighting)
        const ui = reactive({ ...T.state });
        const themeNames = T.themeNames;
        const modeOptions = [{ value: 'light', label: 'Light' }, { value: 'dark', label: 'Dark' }, { value: 'system', label: 'Auto' }];
        const sizeOptions = [{ value: 'small', label: 'S' }, { value: 'medium', label: 'M' }, { value: 'large', label: 'L' }, { value: 'xlarge', label: 'XL' }];

        /**
         * Builds the diagonal light/dark accent gradient shown on a palette swatch.
         *
         * @param {string} name  - the theme name whose accents to preview
         * @returns {object} an inline-style object with the gradient background
         */
        const swatchStyle = (name) => {
          const t = T.THEMES[name];
          return { background: `linear-gradient(135deg, ${t.light.primary} 50%, ${t.dark.primary} 50%)` };
        };

        /**
         * Applies a palette selection and mirrors it into `ui` for highlighting.
         *
         * @param {string} n  - the theme name to activate
         * @returns {void}
         */
        const selectTheme = (n) => { T.setTheme(n); ui.theme = T.state.theme; };

        /**
         * Applies a variant-mode selection and mirrors it into `ui`.
         *
         * @param {'light'|'dark'|'system'} m  - the variant mode to activate
         * @returns {void}
         */
        const selectVariant = (m) => { T.setVariant(m); ui.variantMode = T.state.variantMode; };

        /**
         * Applies a text-size selection and mirrors it into `ui`.
         *
         * @param {string} s  - the font-size key to activate
         * @returns {void}
         */
        const selectFontSize = (s) => { T.setFontSize(s); ui.fontSize = T.state.fontSize; };

        const routerStatus = ref('unknown');
        const models = ref([]);
        const loadingModels = reactive({});

        // Live llama-server replicas as [{ port, model }], sorted by port — one
        // tab / embedded UI each. Rebuilt from /router on every poll.
        const instances = ref([]);
        // Per-port reload counter, folded into the iframe src so the ↻ button can
        // force just the active instance's UI to re-fetch.
        const nonces = reactive({});

        // True once at least one replica is live, i.e. there is an instance whose
        // UI we can embed. Drives the empty state.
        const anyLoaded = computed(() => instances.value.length > 0);

        const statusDotClass = computed(() => {
          const map = {
            idle: 'bg-info', serving: 'bg-success animate-pulse', starting: 'bg-warning animate-pulse',
            stopping: 'bg-warning', inactive: 'bg-base-content/20', error: 'bg-error animate-pulse',
          };
          return map[routerStatus.value] || 'bg-base-content/20';
        });

        // --- Instance tabs ---
        const activeTab = ref(null);

        /**
         * Builds the same-origin proxy URL of a replica's own web UI.
         *
         * Points at /instance/{port}/ on this same origin (not the raw instance
         * port), so it works over Tailscale and behind a reverse proxy where only
         * the router port is reachable. The router's pass-through proxy forwards
         * it straight to that replica, off the scheduler/RWLock. The reload nonce
         * is appended as a query param to force a fresh load on demand.
         *
         * @param {number} port  - the replica's port
         * @returns {string} the root-relative URL to embed for that instance
         */
        function frameSrc(port) {
          const n = nonces[port] || 0;
          return `/instance/${port}/${n ? '?_r=' + n : ''}`;
        }

        /**
         * Makes an instance tab active.
         *
         * @param {number} port  - the port of the instance to focus
         * @returns {void}
         */
        function selectTab(port) {
          activeTab.value = port;
        }

        /**
         * Reloads the active instance's iframe (e.g. after a fresh model load).
         *
         * Bumps that port's reload nonce, which is part of the iframe src, forcing
         * the embedded UI to re-fetch without disturbing the other instances.
         *
         * @returns {void}
         */
        function reloadActive() {
          const port = activeTab.value;
          if (port == null) return;
          nonces[port] = (nonces[port] || 0) + 1;
        }

        // --- Data fetching ---
        /**
         * Refreshes router status and the live instance list.
         *
         * Rebuilds the instance tabs from /router (port -> model), keeping the
         * active tab if its instance still exists, otherwise falling back to the
         * first one (or none when nothing is loaded).
         *
         * @returns {Promise<void>}
         */
        async function fetchStatus() {
          try {
            const data = await (await fetch('/router')).json();
            routerStatus.value = data.status;
            const map = data.instances || {};
            instances.value = Object.keys(map)
              .map(p => ({ port: Number(p), model: map[p] }))
              .sort((a, b) => a.port - b.port);
            if (instances.value.length === 0) {
              activeTab.value = null;
            } else if (!instances.value.some(t => t.port === activeTab.value)) {
              activeTab.value = instances.value[0].port;
            }
          } catch {}
        }

        /**
         * Refreshes the configured models and their loaded state.
         *
         * @returns {Promise<void>}
         */
        async function fetchModels() {
          try {
            const data = await (await fetch('/router/models')).json();
            const list = data.data || [];
            models.value = list.map(m => ({
              id: m.id,
              loaded: m.status?.value === 'loaded',
              loading: !!loadingModels[m.id],
            }));
          } catch {}
        }

        /**
         * Loads a model through the router, then refreshes state.
         *
         * @param {string} modelId  - the model id to load
         * @returns {Promise<void>}
         */
        async function loadModel(modelId) {
          loadingModels[modelId] = true;
          const m = models.value.find(x => x.id === modelId);
          if (m) m.loading = true;
          try {
            await fetch('/models/load', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ model: modelId }),
            });
          } catch {}
          delete loadingModels[modelId];
          await Promise.all([fetchStatus(), fetchModels()]);
        }

        /**
         * Unloads a model through the router, then refreshes state.
         *
         * @param {string} modelId  - the model id to unload
         * @returns {Promise<void>}
         */
        async function unloadModel(modelId) {
          loadingModels[modelId] = true;
          const m = models.value.find(x => x.id === modelId);
          if (m) m.loading = true;
          try {
            await fetch('/models/unload', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ model: modelId }),
            });
          } catch {}
          delete loadingModels[modelId];
          await Promise.all([fetchStatus(), fetchModels()]);
        }

        let pollTimer = null;

        /**
         * Polls router status and model state on an interval.
         *
         * @returns {Promise<void>}
         */
        async function pollAll() {
          await Promise.all([fetchStatus(), fetchModels()]);
        }

        onMounted(async () => {
          await pollAll();
          pollTimer = setInterval(pollAll, 5000);
        });

        onUnmounted(() => clearInterval(pollTimer));

        return {
          ui, themeNames, modeOptions, sizeOptions, swatchStyle, selectTheme, selectVariant, selectFontSize,
          routerStatus, models, anyLoaded, statusDotClass,
          instances, activeTab, nonces, selectTab, reloadActive, frameSrc,
          loadModel, unloadModel,
        };
      },
    }).mount('#app');
  </script>
</body>
</html>
