[*] # global settings for every model
jinja = true
fa = true
ngl = 99

# `device` pins the model physically; keep it in sync with the "gpus" field in
# config.json (the router's scheduling accounting). Omit both = GPU 0 only
# (still set device = CUDA0 on multi-GPU hosts so llama.cpp doesn't shard it).

[GPT-OSS-20B]
model = /models/gpt-oss-20b-F16.gguf
device = CUDA0,CUDA1
c = 131072
b = 16384
ub = 1024
parallel = 4

[GLM-4.7-Flash]
model = /models/GLM-4.7-Flash-IQ4_XS.gguf
device = CUDA2
c = 65536
b = 16384
ub = 512
parallel = 4

[Qwen3-4B-Instruct]
model = /models/Qwen3-4B-Instruct-2507-Q8_0.gguf
device = CUDA0
c = 32768
b = 4096
ub = 512
parallel = 8

[Big-Model]
# gpus = "all" in config.json; no device key = llama.cpp default (all GPUs)
model = /models/big-model.gguf
c = 32768
b = 4096
ub = 512
parallel = 1
