[*] # global settings for every model
jinja = true
fa = true
ngl = 99

# Prompt cache. "cram" is the host-memory cap, in MiB, for conversations that are
# not in a slot right now, per llama-server process (llama.cpp default 8192, 0
# disables it). Size it by what one conversation costs at the length you actually
# run, measured, not extrapolated from a short prompt: each one costs a fixed part
# plus a part that grows with the prompt. Gemma-4-26B-A4B is 176 MiB plus 5.7
# KiB/token, so 909 MiB at its full 131k window; Wordslop-Qwen3.6-27B is 766 MiB
# plus 30.2 KiB/token, so 8500 MiB at its full 262k window. Past the cap llama.cpp
# drops the least recently used conversation and returning to it costs a full
# reprocess. The cap is not an allocation. There is no time-based expiry: size and
# LRU are the only controls, and a model swap ends the process, which drops its
# cache with it. Override cram per model when one model's KV is much heavier than
# the rest.
cram = 8192
ctk = q4_0
ctv = q4_0

# "cache-reuse" salvages a prompt whose middle changed, by KV shifting, but every
# sliding-window and hybrid context ignores it and logs "cache_reuse is not
# supported by this context" at load, so it is off here.
# cache-reuse = 256

# A model whose cache is much heavier than the rest overrides cram in its own
# section, below. One global cram either starves the heavy model or wastes memory
# on the light one, and because the cap is per llama-server process, only the
# loaded model's cap is ever live.

# Physical GPU placement comes from the "gpus" field in config.json: the router
# masks each llama-server to those GPUs via CUDA_VISIBLE_DEVICES, so you do NOT
# set a "device" key here. Devices are renumbered from 0 inside the masked
# process, so absolute "device = CUDA2" ids would not even resolve. Omit "gpus"
# = GPU 0 only; "all"/-1 = every GPU. (Advanced: you may still add tensor-split
# style keys that refer to the process-local 0-based device ids.)

[GPT-OSS-20B]
model = /models/gpt-oss-20b-F16.gguf
c = 131072
b = 16384
ub = 1024
parallel = 4

[GLM-4.7-Flash]
model = /models/GLM-4.7-Flash-IQ4_XS.gguf
c = 65536
b = 16384
ub = 512
parallel = 4

[Qwen3-4B-Instruct]
model = /models/Qwen3-4B-Instruct-2507-Q8_0.gguf
c = 32768
b = 4096
ub = 512
parallel = 8

[Big-Model]
# gpus = "all" in config.json = every GPU visible; llama.cpp shards across them
model = /models/big-model.gguf
c = 262144
b = 4096
ub = 512
parallel = 1
# Long window and a cache that grows on most layers, so it gets its own cap
cram = 32768
